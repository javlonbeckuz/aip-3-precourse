<style>
:root{--yellow:#FDC959;--text-2:#A6A6A6;--ease:cubic-bezier(.2,0,0,1);

@page{size:1920px 1080px;margin:0}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0d0d0d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font:400 30px/1.4 var(--font-body);color:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0}ol,ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
.slide{position:relative;width:1920px;height:1080px;margin:0 auto 24px;padding:80px 96px 88px;background:#000;overflow:hidden;display:flex;flex-direction:column;break-after:page;page-break-after:always}
.slide:last-child{break-after:auto;page-break-after:auto}
@media print{html,body{background:#000}.slide{margin:0}}
.top{display:flex;justify-content:space-between;align-items:center;height:44px;flex:none}
.wm{font:500 28px/1 var(--font-display);font-stretch:125%;text-transform:uppercase}
.mt{font:500 22px/1 var(--font-body);text-transform:uppercase;letter-spacing:.02em;color:var(--text-2);display:flex;gap:28px;align-items:center}
.mt b{font:500 22px/1 var(--font-mono);color:var(--yellow)}
.card{background:var(--yellow);color:#000;border-radius:28px}
.ill{display:block;width:100%;height:auto;aspect-ratio:1;overflow:visible}
.ill .s{stroke:#000;stroke-width:6;stroke-linejoin:round}
.ill text{font-family:var(--font-mono);font-weight:500}
.ill .badge{display:none}
.no{font:500 24px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em}
.disp{font-family:var(--font-display);font-stretch:125%;font-weight:500;text-transform:uppercase}
/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:72px;flex:1;margin-top:48px}
.cover .l{display:flex;flex-direction:column;justify-content:center;gap:40px}
.cover h1{font-size:120px;line-height:1.04;letter-spacing:-.01em}
.cover .lede{font-size:34px;line-height:1.45;color:var(--text-2);max-width:900px}
.cover .r{display:grid;grid-template-columns:1fr 1fr;gap:16px 8px;padding:48px;align-content:center}
/* overview */
.ov-h{margin-top:40px;font-size:64px;line-height:1.1}
.ov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:36px;flex:1}
.ov .card{padding:32px 30px;display:flex;flex-direction:column;gap:12px}
.ov .t{font-size:34px;line-height:1.2}
.ov .ill{width:78%;margin:4px 0}
.ov .n{font:500 24px/1.4 var(--font-body)}
/* item */
.item{display:grid;grid-template-columns:720px minmax(0,1fr);gap:64px;flex:1;margin-top:40px;min-height:0}
.item .card{padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.item .card .no{font-size:30px}
.item .card .ill{width:92%;margin:0 auto}
.item .rt{display:flex;flex-direction:column;min-height:0}
.item h2{font-size:80px;line-height:1.05}
.item .note{margin-top:24px;font-size:30px;line-height:1.38}
.steps{display:grid;gap:14px;margin-top:30px}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:20px;align-items:start;font-size:29px;line-height:1.34}
.steps i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yellow);color:#000;font:500 22px/1 var(--font-display);font-style:normal;font-stretch:125%}
.acts{display:grid;gap:14px;margin-top:auto;padding-top:26px}
.act{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:80px;padding:12px 40px;border-radius:999px;border:2px solid #fff;font-size:28px}
.act.p{background:var(--yellow);border-color:var(--yellow);color:#000}
.act span{font:500 22px/1.2 var(--font-mono)}
.foot{margin-top:auto;padding-top:22px;border-top:1px solid #3F3F3F;color:var(--yellow);font:500 28px/1.3 var(--font-body);text-transform:uppercase}
</style></head>

 [], "footnote": "Keyingi darslarda kerak boʻladi."}]}, "ru": {"intro": "Первое занятие {sana}. Подготовьте этот список до него — всё займёт около 30 минут, а на занятии мы сразу приступим к работе.", "items": [{"brand": "device", "title": "Компьютер", "note": "Рекомендуем MacBook, подойдёт и Windows. Телефона или планшета недостаточно.", "steps": ["Приходите на занятие со своим ноутбуком — практикум от начала до конца практический.", "Возьмите и зарядное устройство.", "Оставьте на диске не менее 5 ГБ свободного места."], "actions": []}, {"brand": "google", "title": "Аккаунт Google", "note": "Claude, NotebookLM и Gemini открываются через этот аккаунт. Если аккаунт уже есть, новый не нужен.", "steps": ["Откройте страницу accounts.google.com/signup.", "Введите имя, фамилию и новый адрес почты.", "Подтвердите номер телефона — придёт SMS-код.", "Запишите пароль: он понадобится на занятии."], "actions": [{"label": "Создать аккаунт Google", "url": "https://accounts.google.com/signup"}]}, {"brand": "claude", "title": "Claude", "note": "Главный инструмент практикума. Сначала заведите учётную запись на claude.ai, затем установите программу.", "steps": ["Зайдите на claude.ai и зарегистрируйтесь через «Continue with Google».", "Скачайте программу со страницы claude.ai/download.", "Mac: откройте файл .dmg и перетащите значок Claude в Applications.", "Windows: запустите файл .exe и подтвердите установку.", "Войдите в программу с тем же аккаунтом Google."], "actions": [{"label": "Скачать программу Claude", "url": "https://claude.ai/download"}, {"label": "Создать учётную запись на claude.ai", "url": "https://claude.ai/", "quiet": true}]}, {"brand": "visa", "title": "Карта Visa", "note": "Понадобится для подписки Claude Pro. На первом занятии хватит и бесплатного тарифа.", "steps": ["Откройте в банке международную Visa или Mastercard — Uzcard и Humo здесь не работают.", "На карте должен быть долларовый счёт и включены онлайн-платежи.", "Подписка Pro — $20 в месяц. Не обязательна, н
