:root{--white:#fff;--slate:#4F6475;--font-display:'Mona Sans','Roboto Flex',sans-serif;--font-body:'Golos Text',system-ui,sans-serif;--font-mono:'Martian Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font-family:var(--font-body);padding:40px 24px 80px}
h1{font:500 30px/1.1 var(--font-display);font-stretch:125%;text-transform:uppercase}
.intro{max-width:70ch;margin-top:10px;color:rgb(255 255 255 / .75);font-size:16px;line-height:1.5}
.opt{margin-top:56px}
.opt>h2{font:500 20px/1.2 var(--font-display);font-stretch:125%;text-transform:uppercase}
.opt>p{max-width:80ch;margin-top:6px;color:rgb(255 255 255 / .75);font-size:15px;line-height:1.5}
.frames{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start;margin-top:18px}
@media (max-width:1100px){.frames{grid-template-columns:minmax(0,1fr)}}
.frame{container-type:inline-size;padding:20px;border:1px solid #333;border-radius:12px;background:radial-gradient(120% 90% at 80% 10%,#1b232a,#000 70%)}
.frame small{display:block;margin-bottom:10px;color:#888;font-size:12px;text-transform:uppercase;letter-spacing:.06em}

/* shared row chrome (as in the portal) */
.row{border-radius:20px;color:#fff;background:linear-gradient(135deg,rgb(255 255 255 / .18),rgb(255 255 255 / .03) 55%),rgb(79 100 117 / .5);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .2),inset 0 1px 0 rgb(255 255 255 / .3),0 18px 40px rgb(0 0 0 / .35)}
.hd{display:grid;grid-template-columns:40px 36px minmax(0,1fr) 20px;gap:0 14px;align-items:center;padding:12px 20px;min-height:72px}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid rgb(255 255 255 / .5)}
.no{font:500 13px/1 var(--font-mono)}
.t{display:block;font:500 18px/1.2 var(--font-display);font-stretch:125%;text-transform:uppercase}
.s{display:block;margin-top:3px;font:400 15px/1.35 var(--font-body);color:rgb(255 255 255 / .8)}
.chv{justify-self:end;width:10px;height:10px;border-right:2px solid;border-bottom:2px solid;transform:rotate(-135deg) translate(-2px,-2px)}
.body{padding:4px 20px 24px 124px}
.d{max-width:62ch;font:400 16px/1.5 var(--font-body);color:rgb(255 255 255 / .88)}
.pill{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:486px;min-height:60px;padding:4px 4px 4px 25px;border:1px solid #fff;border-radius:999px;font:400 18px/1 var(--font-body);color:#fff;text-decoration:none}
.circ{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:#fff;color:#000;flex:none}
.card{display:grid;gap:8px;justify-items:start;align-content:start;padding:20px 22px;border:1.5px dashed rgb(255 255 255 / .55);border-radius:16px;background:rgb(255 255 255 / .06)}
.k{font:500 15px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.04em;color:rgb(255 255 255 / .8)}
.code{font:500 32px/1.1 var(--font-mono);letter-spacing:.04em}
.cp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:#fff;color:var(--slate);font:500 14px/1 var(--font-body)}
.c{display:grid;gap:20px}.l{display:grid;gap:16px;justify-items:start;align-content:start}
@container (max-width:599px){.hd{grid-template-columns:36px minmax(0,1fr) 18px;padding:12px 16px}.no{display:none}.ic{width:36px;height:36px}.body{padding:0 16px 20px}.code{font-size:26px}.t{font-size:16px}}

/* NOW: the portal today */
.now .pill{margin-top:45px}
@container (min-width:900px){.now .c{grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:48px}}
@container (max-width:599px){.now .card{order:-1}}

/* A: two balanced columns, bigger type, the button right under the text */
.a .t{font-size:22px}.a .s{font-size:16px;margin-top:4px}
.a .hd{min-height:84px}
.a .d{font-size:18px;line-height:1.55;max-width:56ch}
.a .pill{width:auto;min-width:240px;max-width:none;margin-top:8px}
.a .code{font-size:38px}
@container (min-width:900px){.a .c{grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start}.a .body{padding-top:8px;padding-bottom:28px}}
@container (max-width:599px){.a .t{font-size:18px}.a .s{font-size:15px}.a .d{font-size:17px}.a .pill{width:100%}.a .code{font-size:30px}}

/* B: one column, then one action row: Ochish + the code chip side by side */
.b .t{font-size:22px}.b .s{font-size:16px;margin-top:4px}
.b .hd{min-height:84px}
.b .d{font-size:18px;line-height:1.55;max-width:64ch}
.b .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-top:22px}
.b .pill{width:auto;min-width:220px;max-width:none}
.b .chip{display:flex;align-items:center;gap:14px;padding:4px 4px 4px 20px;border:1.5px dashed rgb(255 255 255 / .6);border-radius:999px;background:rgb(255 255 255 / .06)}
.b .chip .k{font-size:13px}.b .chip .code{font-size:22px}
@container (max-width:599px){.b .t{font-size:18px}.b .s{font-size:15px}.b .d{font-size:17px}.b .pill,.b .chip{width:100%}.b .chip{justify-content:space-between;flex-wrap:wrap;border-radius:20px;padding:14px 16px}}

/* C: code first: the free promo is the point, so it leads; text and button on the right */
.c3 .t{font-size:22px}.c3 .s{font-size:16px;margin-top:4px}
.c3 .hd{min-height:84px}
.c3 .body{padding:8px 20px 24px}
.c3 .card{padding:26px 28px}
.c3 .k{font-size:14px}.c3 .code{font-size:44px}
.c3 .d{font-size:18px;line-height:1.55;max-width:52ch}
.c3 .pill{width:auto;min-width:240px;max-width:none;margin-top:8px}
@container (min-width:900px){.c3 .c{grid-template-columns:420px minmax(0,1fr);gap:48px;align-items:center}}
@container (max-width:599px){.c3 .t{font-size:18px}.c3 .s{font-size:15px}.c3 .d{font-size:17px}.c3 .pill{width:100%}.c3 .code{font-size:32px}.c3 .body{padding:0 16px 20px}}
</style></head>
<body>
<h1>Mashq va video dars: matn joylashuvi</h1>
<p class="intro">Ochiq turgan Protokol 57 qatori: hozirgi holat va uchta variant. Har biri kompyuter va telefon kengligida. Video dars qatori tanlangan variantdagi oʻlchamlarni oladi.</p>
<div id="opts"></div>
<script>
const ne = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const copy = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>';
const hd = `<div class="hd"><span class="ic">${ne}</span><span class="no">01</span><span><span class="t">Protokol 57</span><span class="s">Prompt yozishni mashq qilish, promokod bilan bepul</span></span><i class="chv"></i></div>`;
const d = `<p class="d">Prompt yozishni mashq qilish platformasi: 57 ta protokol, har bir promptingizga AI 0 dan 100 gacha baho beradi. Praktikum talabalari uchun bepul: toʻlov paytida promokodni kiriting.</p>`;
const pill = `<a class="pill" href="#"><span>Ochish</span><span class="circ">${ne}</span></a>`;
const card = `<div class="card"><span class="k">Promokod, 100% chegirma</span><span class="code">PRAKTIKUM3</span><button class="cp" type="button">${copy}Nusxalash</button></div>`;
const chip = `<div class="chip"><span><span class="k">Promokod</span><br><span class="code">PRAKTIKUM3</span></span><button class="cp" type="button">${copy}Nusxalash</button></div>`;
const OPTS = [
  ['now', 'Hozir', 'Sarlavha 18px, izoh 15px, matn 16px. «Ochish» tugmasi matndan 45px pastda va juda keng; promokod kartasi oʻngda, oʻrtada boʻsh joy qoladi.',
    `${hd}<div class="body"><div class="c"><div class="l">${d}${pill}</div>${card}</div></div>`],
