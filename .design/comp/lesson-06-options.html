<!doctype html>
<html lang="uz-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>06-dars: rang va belgi · variantlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Golos+Text:wght@400;500;600&family=Martian+Mono:wdth,wght@87.5..100,400..500&display=swap">
<style>
/* tokens + folder card: copied from comp/index.html and src/polish.css (no changes) */
:root{--black:#000;--white:#fff;--blue:#0A14FC;--grey:#E0E0E0;--yellow:#FDC959;--lilac:#B4A1D1;
  --surface-1:#161616;--text-2:#A6A6A6;--text-3:#8A8A90;--line:#3F3F3F;--ink:#000;
  --state-live:var(--blue);--state-open:var(--lilac);--state-done:var(--grey);--state-locked:var(--surface-1);--you:var(--yellow);
  --font-display:'Mona Sans','Roboto Flex',sans-serif;--font-body:'Golos Text',system-ui,sans-serif;--font-mono:'Martian Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);color-scheme:dark;
  /* the candidates */
  --orange:#FF7A2F;--emerald:#0B7A55;--pink:#FF6FB5;--cyan:#33CBEA}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
body{background:#000;color:var(--white);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.frame{container-type:inline-size;background:var(--black)}
.site{--u:1px}
@container (min-width:900px){.site{--u:calc(min(100cqi,1440px) / 1440)}}
.folder{--f-bg:var(--grey);--f-ink:var(--black);--rise:16px;--r:14px;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;margin-top:var(--rise);min-height:196px;padding:22px 22px 24px;background:var(--f-bg);color:var(--f-ink);border-radius:var(--r) 0 var(--r) var(--r);transition:filter .15s var(--ease),transform 160ms var(--ease)}
.folder>.tab{position:absolute;right:0;bottom:calc(100% - 1px);display:flex;align-items:center;justify-content:flex-end;min-width:35%;max-width:calc(100% - var(--rise) * 1.8);height:calc(var(--rise) + 1px);padding:0 16px 0 2px;background:var(--f-bg);border-radius:0 var(--r) 0 0}
.tab>.ramp{position:absolute;right:calc(100% - 1px);bottom:0;height:calc(var(--rise) + 1px);width:calc((var(--rise) + 1px) * 28 / 21);color:var(--f-bg)}
@media (hover:hover) and (pointer:fine){a.folder:hover{filter:brightness(1.07)}}
a.folder:active,button.folder:active{transform:scale(.985)}
.c-blue{--f-bg:var(--state-live);--f-ink:var(--white)}
.c-lilac{--f-bg:var(--state-open);--f-ink:var(--ink)}
.c-yellow{--f-bg:var(--you);--f-ink:var(--ink)}
.c-grey{--f-bg:var(--state-done);--f-ink:var(--ink)}
.c-dark{--f-bg:var(--state-locked);--f-ink:var(--text-2)}
.folder.c-dark{outline:1px solid #3F3F3F;outline-offset:-1px}
/* new identity classes, same shape as the existing ones */
.c-orange{--f-bg:var(--orange);--f-ink:var(--ink)}
.c-emerald{--f-bg:var(--emerald);--f-ink:var(--white)}
.c-pink{--f-bg:var(--pink);--f-ink:var(--ink)}
.c-cyan{--f-bg:var(--cyan);--f-ink:var(--ink)}
.folder :focus-visible,.folder:focus-visible{outline-color:var(--white)}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.f-label{font:500 13px/1.35 var(--font-body);text-transform:uppercase;max-width:18em}
.f-arrow{width:28px;height:28px;margin:-2px -4px 0 0}
.f-title{display:block;font:500 19px/1.36 var(--font-display);font-stretch:125%;text-transform:uppercase;text-wrap:balance}
.f-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.f-note{margin-left:auto;font:500 14px/1.3 var(--font-body);text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.f-note .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.f-note svg{width:14px;height:14px}
button.folder{width:100%;text-align:left;cursor:pointer}
.grid3{display:grid;gap:12px;padding:24px 16px 48px}
@container (min-width:900px){.folder{--rise:calc(21 * var(--u));--r:calc(15 * var(--u));min-height:calc(231 * var(--u));padding:calc(31 * var(--u)) calc(27 * var(--u)) calc(34 * var(--u))}
.folder>.tab{padding-right:calc(20 * var(--u))}
.f-label{font-size:max(12px,calc(15 * var(--u)))}
.f-arrow{width:calc(34 * var(--u));height:calc(34 * var(--u))}
.f-title{font-size:max(16px,calc(22 * var(--u)))}
.f-note{font-size:max(14px,calc(15 * var(--u)))}
.grid3{grid-template-columns:repeat(6,1fr);gap:calc(28 * var(--u)) calc(16 * var(--u));padding:calc(40 * var(--u)) calc(61 * var(--u)) calc(64 * var(--u)) calc(66 * var(--u))}
.grid3 .folder{min-height:calc(260 * var(--u))}
.grid3>li{grid-column:span 2}
.grid3>li:nth-child(n+4){grid-column:span 3}}

/* preview page chrome only */
.pg{max-width:1440px;margin:0 auto;padding:32px 24px 80px}
.pg-h{font:500 28px/1.15 var(--font-display);font-stretch:125%;text-transform:uppercase;max-width:22em;text-wrap:balance}
.pg-l{margin-top:12px;max-width:62ch;color:var(--text-2);text-wrap:pretty}
.opt{margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.opt-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font:500 22px/1.2 var(--font-display);font-stretch:125%;text-transform:uppercase}
.opt-h .rec{font:500 14px/1 var(--font-body);color:var(--yellow)}
.opt-p{margin-top:8px;max-width:62ch;color:var(--text-2);text-wrap:pretty}
.sw{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px}
.sw li{display:flex;align-items:center;gap:10px;font:400 13px/1.3 var(--font-mono);color:var(--text-2)}
.sw i{width:28px;height:28px;border-radius:6px;background:var(--c)}
.sw b{font:500 15px/1.3 var(--font-body);color:var(--white)}
.views{display:flex;gap:32px;align-items:flex-start;margin-top:24px}
.phone{flex:none;width:390px;border:1px solid var(--line)}
.deskw{flex:1;min-width:0}
.desk{width:1440px;border:1px solid var(--line)}
.vt{margin-bottom:8px;font:500 13px/1.3 var(--font-body);color:var(--text-3)}
@media (max-width:899px){.pg{padding:24px 16px 64px}
.pg-h{font-size:22px}
.views{flex-direction:column;align-items:stretch;gap:24px}
.phone{width:auto;margin:0 -16px;border-width:1px 0}
.deskw{width:100%}}
/* this page: the app's current grid (12 columns, span 3), and the 06 card's candidates */
@container (min-width:900px){.grid3{grid-template-columns:repeat(12,1fr)}.grid3>li,.grid3>li:nth-child(n+4){grid-column:span 3}}
.c-pink{--f-bg:#FF6FB5;--f-ink:#000}.c-lime{--f-bg:#C6F135;--f-ink:#000}.c-wine{--f-bg:#8E1F47;--f-ink:#fff}
.f-badge{width:28px;height:28px;margin:-2px -4px 0 0}
@container (min-width:900px){.f-badge{width:calc(34 * var(--u));height:calc(34 * var(--u))}}
.views{flex-direction:column;align-items:stretch;gap:20px}.deskw{flex:none}.phone{width:390px;align-self:flex-start}.desk{width:100%}
.opt .grid3{padding-top:calc(24 * var(--u))}
@media (max-width:899px){.grid3>li:not(.l6){display:none}.views .deskw{display:none}.pg{padding:16px}.pg-h{font-size:20px}.opt{margin-top:28px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-ramp" viewBox="0 0 28 21"><path d="M0 21Q4 21 7 18L22 3Q25 0 28 0V21Z" fill="currentColor"/></symbol>
<symbol id="i-ne" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 28L28 6M10 6h18v18"/></symbol>
<symbol id="i-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8.5"/></symbol>
<symbol id="i-lock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="12" height="8.5" rx="1.5"/><path d="M7 9V6.5a3 3 0 016 0V9"/></symbol>
<symbol id="i-trophy" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h14v8a7 7 0 0 1-14 0z"/><path d="M10 8H6.5v2.5A3.5 3.5 0 0 0 10 14M24 8h3.5v2.5A3.5 3.5 0 0 1 24 14"/><path d="M17 20v5M13.5 25h7v4h-7zM11.5 29h11"/></symbol>
<symbol id="i-cert" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h22v16H6z"/><path d="M11 11h12M11 15h7"/><circle cx="24" cy="24" r="4"/><path d="M22 27.5L21 32l3-1.5 3 1.5-1-4.5"/></symbol>
</svg>
<main class="pg">
  <h1 class="pg-h">06-dars: rang va belgi</h1>
  <p class="pg-l">06-dars (Natijalar va demo kuni) hozir moviy-havorang. Quyida uchta yangi rang va ikki belgi (kubok, sertifikat). Kartalar ilovadagi bilan bir xil. 1-kun bosh sahifasi: 01, Kirish, 02…06.</p>
  <div id="opts"></div>
</main>
<script>
const uz = s => s.replace(/ʻ/g, '‘').replace(/ʼ/g, '’');
const I = id => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const tab = `<span class="tab"><svg class="ramp" aria-hidden="true"><use href="#i-ramp"/></svg></span>`;
const arrow = `<svg class="f-arrow" aria-hidden="true"><use href="#i-ne"/></svg>`;
const lk = (c, label, t, sub, date, extra = '', cls = '') => `<li class="${cls}"><button class="folder c-${c}" type="button">${tab}<span class="f-top"><span class="f-label">${label}</span>${extra}</span><span class="f-row"><span><span class="f-title">${uz(t)}</span>${sub ? `<span class="f-sub">${uz(sub)}</span>` : ''}</span><span class="f-note">${I('lock')}${uz(date)}</span></span></button></li>`;
const OPTS = [
  {k: 'A', c: 'pink', hex: '#FF6FB5', ink: 'qora', r: '8.19', ic: 'trophy', icn: 'Kubok', p: 'Pushti: foydalanuvchi taklifi. Barcha hozirgi ranglardan aniq farq qiladi, 05 (toʻq sariq) bilan yonma-yon issiq, 06 yonidagi zumrad bilan toʻldiruvchi juftlik.', near: 'eng yaqini lilak, ΔE 47'},
  {k: 'B', c: 'lime', hex: '#C6F135', ink: 'qora', r: '16.03', ic: 'trophy', icn: 'Kubok', p: 'Laym-yashil: gʻalaba va yakun hissi, eng yuqori kontrast. Lekin 05 zumrad bilan yonma-yon ikkalasi yashil oilasida.', near: 'eng yaqini sariq (faqat Tayyorgarlik), ΔE 48'},
  {k: 'C', c: 'wine', hex: '#8E1F47', ink: 'oq', r: '8.62', ic: 'trophy', icn: 'Kubok', p: 'Bordo: diplom va bitiruv libosi. Toʻq karta, oq matn. Xato rangiga oʻxshamaydi, lekin 04 toʻq bilan birga ikki toʻq karta boʻladi.', near: 'eng yaqini toʻq 04, ΔE 55'},
  {k: 'D', c: 'pink', hex: '#FF6FB5', ink: 'qora', r: '8.19', ic: 'cert', icn: 'Sertifikat', rec: true, p: 'Tavsiya: pushti (A) va sertifikat belgisi. Kubok musobaqa, sertifikat esa kursni tugatganlik: bu dars natijalar va demo kuni, shuning uchun sertifikat maʼnosiga yaqinroq.', near: ''},
];
const grid = o => `<ol class="grid3">
  <li><a class="folder c-lilac" href="#o${o.k}">${tab}<span class="f-top"><span class="f-label">01-dars · 21-noyabr</span>${arrow}</span><span class="f-row"><span class="f-title">AI qanday<br>ishlaydi</span><span class="f-note"><span class="dot" aria-hidden="true"></span>Hozir davom etmoqda · 0/3 bajarildi</span></span></a></li>
  ${lk('grey', 'Kirish', 'Kirish', '', 'Sana keyinroq')}
  ${lk('blue', '02-dars', 'Claude<br>Code', '', '28-noyabrda ochiladi')}
  ${lk('dark', '03-dars', 'API va<br>MCP', '', '5-dekabrda ochiladi')}
  ${lk('orange', '04-dars', 'Ishga<br>tushirish', '', '12-dekabrda ochiladi')}
  ${lk('emerald', '05-dars', 'Agentni<br>yaxshilash', '', '19-dekabrda ochiladi')}
  ${lk(o.c, '06-dars', 'Natijalar va<br>demo kuni', '', '26-dekabrda ochiladi', `<svg class="f-badge" aria-hidden="true"><use href="#i-${o.ic}"/></svg>`, 'l6')}
</ol>`;
document.getElementById('opts').innerHTML = OPTS.map(o => `
  <section class="opt" id="o${o.k}" aria-labelledby="h${o.k}">
    <h2 class="opt-h" id="h${o.k}">Variant ${o.k}: ${o.hex} · ${o.icn}${o.rec ? '<span class="rec">Tavsiya</span>' : ''}</h2>
    <p class="opt-p">${uz(o.p)}</p>
    <ul class="sw"><li><i style="--c:${o.hex}"></i><span><b>06-dars</b><br>${o.hex} · ${o.ink} matn ${o.r}:1 ${o.near ? '· ' + uz(o.near) : ''}</span></li></ul>
    <div class="views">
      <div class="deskw"><p class="vt">Kompyuter, 1440 px</p><div class="desk frame"><div class="site">${grid(o)}</div></div></div>
      <div><p class="vt">Telefon, 390 px</p><div class="phone frame"><div class="site"><ol class="grid3">${grid(o).match(/<li class="l6">[\s\S]*?<\/li>/)[0]}</ol></div></div></div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
