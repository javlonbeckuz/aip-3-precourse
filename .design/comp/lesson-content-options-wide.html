<!doctype html>
<html lang="uz-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Dars uslublari: keng sahifa</title>
<link rel="stylesheet" href="../../public/aip/app.css">
<style>
body{background:#000;margin:0}
.lc-opt{margin:0 0 56px}
.lc-name{margin:0;padding:14px 16px;font:500 15px/1.4 var(--font-body);color:#fff;border-bottom:1px solid #3F3F3F;background:#0b0b0b}
.lc-name small{display:block;margin-top:2px;font:400 13px/1.4 var(--font-body);color:#A6A6A6}
.lc-cap{margin:0;padding:10px 16px;font:500 13px/1.3 var(--font-mono);color:#A6A6A6}
.lc-h{margin:0;padding:10px 16px;font:500 13px/1.3 var(--font-mono);color:#FDC959}
/* the lesson pane content (all styles): flat, ink = the folder's ink, lines = the folder's line colour */
.lc{display:grid;gap:0;min-width:0}
.lc ol,.lc ul{margin:0;padding:0;list-style:none}
.lc-intro{margin:0 0 14px;font:400 15px/1.5 var(--font-body)}
.lc-intro+.lc-intro{margin-top:-4px}
.lc-row{border-top:1px solid var(--gt-line)}
.lc-row:last-child{border-bottom:1px solid var(--gt-line)}
.lc-sum{display:grid;grid-template-columns:34px minmax(0,1fr) 24px;gap:0 8px;align-items:center;width:100%;min-height:64px;padding:10px 0;text-align:left;cursor:pointer}
.lc-no{font:500 13px/1.3 var(--font-mono);letter-spacing:0}
.lc-tt{display:block;font:500 16px/1.25 var(--font-display);font-stretch:125%;text-transform:uppercase;text-wrap:balance}
.lc-meta{display:block;margin-top:4px;font:500 12.5px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em;color:var(--gt-ink2)}
.lc-chev{justify-self:end;width:10px;height:10px;margin-right:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--ease)}
.lc-row[data-open="1"] .lc-chev{transform:rotate(-135deg) translate(-2px,-2px)}
.lc-body{display:none;padding:0 0 18px 42px}
.lc-row[data-open="1"] .lc-body{display:block}
.lc-lead{margin:0 0 10px;font:400 14.5px/1.5 var(--font-body)}
.lc-steps{display:grid;gap:6px;margin:0 0 12px!important;padding-left:20px!important;list-style:decimal!important;font:400 15px/1.45 var(--font-body)}
.lc-steps li{display:list-item}
.lc-ready{margin:0 0 14px;padding:10px 12px;border:1px solid var(--gt-line);border-radius:10px;font:400 14.5px/1.45 var(--font-body)}
.lc-ready b{display:block;margin-bottom:2px;font:500 12px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em}
.lc-pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--gt-line)}
.lc-pr .pt{font:500 15px/1.3 var(--font-body)}
.lc-pr .pw{grid-column:1;font:400 13px/1.3 var(--font-body);color:var(--gt-ink2)}
.lc-pr .cpb{grid-row:1/3;grid-column:2;display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--gt-ink);border-radius:50%}
.lc-pr .tg{grid-column:1/-1;justify-self:start;min-height:32px;padding:4px 0;font:500 13px/1.3 var(--font-body);text-decoration:underline;text-underline-offset:3px}
.lc-pr .tx{display:none;grid-column:1/-1;margin:2px 0 6px;padding:10px 12px;border:1px solid var(--gt-line);border-radius:10px;font:400 14px/1.55 var(--font-body);white-space:pre-line}
.lc-pr[data-open="1"] .tx{display:block}
.lc-chk{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;font:500 14px/1.3 var(--font-body)}
.lc-chk::before{content:"";flex:none;width:24px;height:24px;border:2px solid currentColor;border-radius:6px}
.lc-chk[aria-pressed="true"]::before{background:currentColor var(--ck-w) center/16px no-repeat}
.lc-sum .lc-no.chk{display:grid;place-items:center;width:24px;height:24px;border:2px solid currentColor;border-radius:6px;font-size:0}
.lc-sum .lc-no.chk.on{background:currentColor var(--ck-w) center/16px no-repeat}
/* B: cards + sub-page */
.lc-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container (min-width:900px){.lc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(14 * var(--u))}}
.lc-card{display:grid;gap:6px;align-content:start;min-height:112px;padding:16px;border:1.5px solid var(--gt-ink);border-radius:14px;text-align:left}
.lc-card .lc-no{font-size:13px}
.lc-card .lc-sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;font:400 14px/1.4 var(--font-body);color:var(--gt-ink2)}
.lc-card .lc-cn{margin-top:4px;font:500 12.5px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em}
.lc-sub-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.lc-back{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:500 13px/1.3 var(--font-body);text-transform:uppercase}
.lc-pn{display:flex;gap:8px}
.lc-arrow{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--gt-ink);border-radius:50%}
.lc-arrow.off{opacity:.35}
.lc-title2{margin:0 0 10px;font:500 22px/1.2 var(--font-display);font-stretch:125%;text-transform:uppercase;text-wrap:balance}
/* C: stepper */
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.lc-count{font:500 14px/1.3 var(--font-mono)}
.lc-strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:16px}
.lc-strip i{height:6px;border-radius:3px;background:var(--gt-line)}
.lc-strip i.on{background:var(--gt-ink)}
.lc-ex .lc-no{display:block;margin-bottom:4px}
.lc-pane-only{padding-bottom:6px}

/* full-width lesson page: the hero on top (title left, summary right), the folder across the whole page below */
.w-hr{display:grid;gap:12px;align-content:end}
.w-wrap{padding:40px 16px 64px}
@container (min-width:900px){.w-hero{align-items:end}.w-wrap{padding:calc(56 * var(--u)) calc(50 * var(--u)) calc(80 * var(--u)) calc(66 * var(--u))}}
.w-wrap .gt-pane{display:block}
.w-intro{display:grid;gap:10px;max-width:none;margin:0 0 28px;font:400 15px/1.5 var(--font-body)}
@container (min-width:900px){.w-intro{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 48px;font-size:16px}}
.mtag{font:500 12px/1.3 var(--font-mono);letter-spacing:.02em}
.lead{margin:0 0 10px;font:400 15px/1.5 var(--font-body);max-width:62ch}
.stp{display:grid;gap:6px;margin:0 0 12px!important;padding-left:20px!important;list-style:decimal!important;font:400 15px/1.45 var(--font-body);max-width:62ch}
.stp li{display:list-item}
.rdy{margin:0;font:400 14px/1.45 var(--font-body);max-width:62ch}
.rdy b{margin-right:6px;font:500 12px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em}
.pcs{border-bottom:1px solid var(--gt-line)}
.pcs-h{margin:0 0 6px;font:500 12px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.02em}
.pc2{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:0 10px;align-items:center;width:100%;min-height:58px;padding:6px 0;border-top:1px solid var(--gt-line);text-align:left;cursor:pointer;color:var(--gt-ink)}
.pc2 .no{font:500 12px/1.3 var(--font-mono)}
.pc2 .t{display:block;font:500 15px/1.3 var(--font-body)}
.pc2 .w{display:block;font:400 12.5px/1.3 var(--font-body);color:var(--gt-ink2)}
.pc2 .cpb{display:grid;place-items:center;width:44px;height:44px;border:1.5px solid var(--gt-ink);border-radius:50%}
.w-none{margin:0;font:400 14px/1.4 var(--font-body);color:var(--gt-ink2)}
/* W1 */
.w-row{display:grid;gap:14px;padding:26px 0;border-top:1.5px solid var(--gt-ink)}
.w-no{display:block;margin-bottom:10px;font:400 64px/.8 var(--font-display);font-stretch:125%;letter-spacing:-.03em}
.w-tt{margin:0 0 6px;font:500 18px/1.2 var(--font-display);font-stretch:125%;text-transform:uppercase;text-wrap:balance}
@container (min-width:900px){.w-row{grid-template-columns:calc(300 * var(--u)) minmax(0,1fr) calc(420 * var(--u));gap:0 calc(40 * var(--u));padding:32px 0}.w-no{font-size:80px}}
/* W2 */
.d-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.d-pill{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border:1.5px solid var(--gt-ink);border-radius:999px;font:500 14px/1 var(--font-mono);color:var(--gt-ink)}
.d-pill .pt{font:500 14px/1 var(--font-body)}
.d-pill.on{background:var(--gt-ink);color:var(--gt-fill)}
.w2{display:grid;gap:20px}
.w2-tt{margin:6px 0 14px;font:500 28px/1.15 var(--font-display);font-stretch:125%;text-transform:uppercase;text-wrap:balance}
@container (min-width:900px){.w2{grid-template-columns:minmax(0,1fr) calc(480 * var(--u));gap:calc(56 * var(--u))}}
.d-next{display:flex;justify-content:flex-end;margin-top:22px;padding-top:14px;border-top:1px solid var(--gt-line);font:500 13px/1.3 var(--font-body);text-transform:uppercase}
/* W3 */
.w3{display:grid;gap:20px}
.w3-nav{display:grid;border-top:1px solid var(--gt-line)}
.w3-nav a{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-bottom:1px solid var(--gt-line);border-radius:0;font:500 15px/1.3 var(--font-body);color:var(--gt-ink);text-decoration:none}
.w3-nav a svg{margin-left:auto}
.w3-nav .no{font:500 12px/1.3 var(--font-mono)}
.w3-nav a.on{background:var(--gt-ink);color:var(--gt-fill)}
@container (min-width:900px){.w3{grid-template-columns:calc(340 * var(--u)) minmax(0,1fr);gap:calc(56 * var(--u))}.w3-nav{align-self:start}}
.cbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:#111;border-bottom:1px solid #333;font:500 13px/1 var(--font-body);color:#fff}
.cbar button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid #444;border-radius:999px;color:#fff;font:inherit}
.cbar button.on{border-color:#fff;background:#fff;color:#000}
.cbar .sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .3)}
.sw-lilac{background:var(--lilac)}.sw-grey{background:var(--grey)}.sw-blue{background:var(--blue)}.sw-dark{background:var(--state-locked)}.sw-orange{background:var(--orange)}.sw-emerald{background:var(--emerald)}.sw-cream{background:var(--cream)}
/* compact header: back link and date on one line at the top, the title on one line */
.w-top{padding:20px 16px 0}
.w-dl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;margin:0}
.w-dl .eyebrow{margin:0}
.w-h1{margin:16px 0 0;font:500 clamp(28px,8cqi,40px)/1.1 var(--font-display);font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em;color:var(--white);text-wrap:balance}
.w-hr{display:grid;gap:10px;margin-top:16px}
@container (min-width:900px){.w-top{padding:calc(28 * var(--u)) calc(50 * var(--u)) 0 calc(66 * var(--u))}.w-h1{margin-top:calc(18 * var(--u));font-size:calc(56 * var(--u));white-space:nowrap}.w-hr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 calc(48 * var(--u));margin-top:calc(20 * var(--u))}.w-wrap{padding-top:calc(36 * var(--u))}}
@container (max-width:899px){.w-h1 .w-n{display:block}}

<script>
const DATA = {"subtitle": "AI qatlamlari, token, kontekst, modellar, NotebookLM, Kit 1", "summary": "Avval oʻz biznesingiz uchun birinchi vositani yasaymiz. Keyin AI qayerda ishlashi, token va kontekst nima ekani, qaysi modelni tanlashni koʻramiz. Kit 1: ish qayerga ketadi.", "amaliyot": {"text": "Bu amaliyotda oʻz biznesingiz uchun birinchi ishlaydigan vositani yasaysiz, modellarni solishtirasiz va Kit 1 intervyusini sinab koʻrasiz.\n\nOʻz noutbukingizda, oʻz biznesingiz maʼlumotlari bilan ishlang.\n\nMijozlarning shaxsiy maʼlumotlarini chatga yozmang. Chatga yozilgan matn provayderning data markaziga ketadi, odatda AQSh yoki Yevropaga.\n\nQiynalsangiz: xatoning skrinshotini oling va Claudeʼdan soʻrang. Hal boʻlmasa, mentorni chaqiring.", "groups": [{"title": "01 Birinchi artifakt", "note": "ASOSIY. 1) Claude ilovasida yangi chat oching. 2) Oʻz mahsulotlaringiz uchun narx kalkulyatori yoki bir sahifalik taklif soʻrang. 3) Natijada bitta narsani chat orqali oʻzgartiring. Tayyor, agar: kalkulyator haqiqiy mahsulotlaringiz bilan ishlaydi.", "files": [], "prompts": [{"id": "01P1", "title": "Narx kalkulyatori", "target": "Claude", "text": "Mening biznesim: [kompaniya nomi], [nima bilan shugʻullanadi].\nMahsulotlar va narxlar (soʻmda):\n[mahsulotlar roʻyxati va narxlari]\n\nShu mahsulotlar uchun narx kalkulyatorini artifakt qilib yasang. Mijoz mahsulot va miqdorni tanlasin, jami summa soʻmda chiqsin. [Chegirma yoki yetkazish sharti boʻlsa, shu yerga yozing.]\nInterfeys oʻzbek tilida boʻlsin. Roʻyxatda yoʻq mahsulot yoki narx qoʻshmang."}, {"id": "01P2", "title": "Bir sahifalik taklif", "target": "Claude", "text": "Mening biznesim: [kompaniya nomi], [nima bilan shugʻullanadi].\nMijozlarim: [kimlar].\nAsosiy mahsulotlar va narxlar: [mahsulotlar roʻyxati va narxlari].\n\nMijozga yuboriladigan bir sahifalik taklifni artifakt qilib yasang. Unda nima taklif qilinishi, narxlar, shartlar va bogʻlanish uchun [telefon yoki Telegram] boʻlsin.\nOʻzbek tilida, qisqa yozing. Men bermagan raqam, kafolat yoki natija qoʻshmang."}, {"id": "01P3", "title": "Bitta oʻzgartirish", "target": "Claude", "text": "Artifaktga shu oʻzgartirishni kiriting: [nima oʻzgarsin, masalan: 10 donadan ortiq xaridga chegirma qatorini qoʻshing].\nQolgan qismini oʻzgartirmang. Nima oʻzgarganini ikki gapda yozing."}]}, {"title": "02 Token tajribasi", "note": "ASOSIY. Token: matn boʻlinadigan va pul toʻlanadigan birlik. 1) Darsda koʻrsatilgan tokenizerni oching. 2) Biznesingizga oid bitta gapni oʻzbekcha qoʻying va tokenlar sonini yozib oling. 3) Xuddi shu gapni inglizcha qoʻying va solishtiring. Tayyor, agar: tokenlar farqini ayta olasiz.", "files": []}, {"title": "03 Modellarni solishtirish", "note": "ASOSIY. Claude modellari: Haiku arzon va tez, Sonnet oʻrta, Opus murakkab ish uchun. Open-weight model: fayli ochiq eʼlon qilingan, uni istalgan kishi oʻz serverida ishlata oladi (DeepSeek, Qwen). 1) Maxfiy boʻlmagan ikkita vazifa tanlang. 2) Har birini Claudeʼning ikki darajasida, keyin bepul open-weight chatda (DeepSeek yoki Qwen) bajaring. 3) Sifat va tezlikni yozib boring. DeepSeek saytida ishlasangiz ham, matn DeepSeek serveriga ketadi. Tayyor, agar: ikki vazifaning har biriga model tanladingiz va sababini ayta olasiz.", "files": [], "prompts": [{"id": "03P1", "title": "Matn yozish vazifasi", "target": "Claude, DeepSeek yoki Qwen", "text": "Biz [kompaniya nomi], [nima bilan shugʻullanadi].\n[Mahsulot yoki xizmat] haqida Telegram kanal uchun 3 ta qisqa post yozing. Har biri 60 soʻzdan oshmasin.\nOʻzbek lotin yozuvida, sodda tilda yozing. Narx yoki chegirma oʻylab topmang."}, {"id": "03P2", "title": "Saralash vazifasi", "target": "Claude, DeepSeek yoki Qwen", "text": "Quyidagi mijoz xabarlarini toifalarga ajrating: buyurtma, narx soʻrash, shikoyat, boshqa.\nJadvalda har xabar, uning toifasi va bir gaplik sabab boʻlsin.\n\n[10-20 ta xabar, ism va telefon raqamlarisiz]"}]}, {"title": "04 Kompaniya bilim bazasi", "note": "ASOSIY. NotebookLM faqat siz yuklagan hujjatlardan javob beradi va manbani koʻrsatadi. 1) Yangi notebook oching va 3-5 ta hujjat yuklang: narxlar roʻyxati, ichki qoidalar, shartnoma namunasi. 2) 3 ta savol bering. 3) Hujjatlar orasidagi ziddiyatlarni topishni soʻrang. 4) Audio overview yoki quiz yarating. Tayyor, agar: manba iqtiboslari bilan 3 ta javob bor.", "files": [], "prompts": [{"id": "04P1", "title": "Hujjatdan savol", "target": "NotebookLM → Chat", "text": "Faqat yuklangan hujjatlarga tayanib javob bering: [savol, masalan: ulgurji mijozga qanday chegirma beriladi].\nHar javobga manba nomi va iqtibos keltiring. Hujjatda javob boʻlmasa, \"hujjatda yoʻq\" deb yozing, taxmin qilmang.\nOʻzbek lotin yozuvida yozing."}, {"id": "04P2", "title": "Ziddiyatlarni topish", "target": "NotebookLM → Chat", "text": "Yuklangan hujjatlarni solishtiring va bir-biriga zid joylarni toping: narx, muddat, masʼul shaxs, shartlar.\nJadvalda har ziddiyat, ikkala manbadan iqtibos va kimdan aniqlashtirish kerakligi boʻlsin.\nZiddiyat topilmasa, shuni yozing. Oʻzbek lotin yozuvida yozing."}, {"id": "04P3", "title": "Xodim uchun test", "target": "NotebookLM → Studio → Quiz", "text": "Yangi xodim uchun shu hujjatlar asosida 5 ta savollik test yarating.\nSavollar ish vaziyatlariga oid boʻlsin: narx, ichki qoidalar, shartnoma shartlari. Har javob izohida manba boʻlsin.\nOʻzbek lotin yozuvida yozing."}]}, {"title": "05 Kit 1 mashqi", "note": "ASOSIY. Kit 1 \"Ish qayerga ketadi\": xodim vaqti qaysi vazifalarga ketishini xaritaga tushiradi. Kit 1 shakli (Kit tabida). 1) Yoningizdagi hamkasb bilan juft boʻling va rozilik matnini ovoz chiqarib oʻqing. 2) A.1-A.7 savollari bilan 5 daqiqalik intervyu oʻtkazing va yozib oling. 3) Yozuvni Geminiʼda matnga aylantiring. 4) Matnga Kit 1 promptini qoʻllang va B shakli jadvalini oling. 5) Har raqamni yozuv bilan solishtiring: transkripsiya oʻzbekcha raqamlarda adashadi, \"bir uch-toʻrt yuz ming\" 1 300 000 boʻlib qoladi. Tayyor, agar: B shakli jadvali bor va kamida bitta raqam qoʻlda tuzatilgan.", "files": [], "prompts": [{"id": "05P1", "title": "Transkripsiya", "target": "Gemini", "text": "Ilova qilingan audio yozuvni oʻzbek tilida soʻzma-soʻz matnga aylantiring.\nSuhbatdoshlarni \"Soʻrovchi\" va \"Xodim\" deb ajrating.\nHar raqam, summa va vaqtni eshitilganidek soʻz bilan ham yozing, masalan: 300 000 (\"uch yuz ming\").\nTushunarsiz joyni [?] bilan belgilang, oʻzingizdan toʻldirmang."}, {"id": "05P2", "title": "Kit 1 prompti: B shakli", "target": "Claude", "text": "Quyida xodim bilan intervyu matni va Kit 1 B shakli. Matndan B.1-B.9 boʻyicha vazifalar roʻyxatini tuzing.\nHar vazifada kamida shular boʻlsin: vazifa nomi; bir martasiga necha daqiqa; qanchalik tez-tez (kuniga, haftasiga, oyiga); haftasiga necha soat; B.9 belgisi (A agent, R robot, I inson, B birgalikda).\nRaqamni faqat matndan oling. Matnda aniq boʻlmasa, taxminingiz yoniga [?] qoʻying.\nOxirida haftalik soatlarni jamlang va tekshirilishi kerak boʻlgan raqamlarni alohida roʻyxat qiling. Jadvalni .md formatida bering.\n\nB shakli: [shakl matni]\nIntervyu: [intervyu matni]"}]}]}, "vazifa": {"text": "Bu vazifada Kit 1 ni oʻz xodimlaringiz bilan oʻtkazasiz. Ikkinchi darsda Claude Code shu fayllar bilan ishlaydi.\n\nKeyingi dars boshlanishidan oldin bajaring. Mentor darsning birinchi 20 daqiqasida tekshiradi: kamida 2 ta B shakli .md faylda saqlangan; daqiqa va chastotani xodimning oʻzi tuzatgan, [?] belgilari qolmagan; har vazifada B.9 toʻldirilgan; Claude Code Warpʼda ochiladi.", "groups": [{"title": "1. Jamoaga sababini ayting", "note": "Birinchi intervyudan oldin jamoaga bitta xabar yozing yoki qisqa yigʻilish qiling. Maqsad: ishni xaritaga tushirish, odamlarni almashtirish emas. Har intervyu boshida buni yana ayting.", "files": [], "prompts": [{"id": "V1P1", "title": "Jamoaga xabar", "target": "Claude", "text": "Men [kompaniya nomi] rahbariman. [Boʻlim nomi] xodimlari bilan 20-30 daqiqalik suhbat oʻtkazmoqchiman.\nMaqsad: kim qaysi ishga qancha vaqt sarflashini bilish va takrorlanadigan ishni AI bilan yengillashtirish. Maqsad odamlarni almashtirish emas.\nJamoaga Telegramda yuboriladigan xabar yozing: suhbat nima uchun, qancha vaqt oladi, yozib olinishi va yozuvni kim koʻrishi: [kim koʻradi].\nOddiy tilda, 80 soʻzdan oshmasin."}]}, {"title": "2. 2-3 xodim bilan intervyu", "note": "Bitta boʻlimdan 2-3 xodim bilan 20-30 daqiqalik Kit 1 A intervyusini oʻtkazing. Yozib olishdan oldin rozilik matnini oʻqing. Yakka ishlaydigan egalar va jamoasi yoʻq rahbarlar oʻzini yoki boʻlim boshligʻini intervyu qiladi. Kit 1 shakli (Kit tabida).", "files": []}, {"title": "3. Matnga aylantiring va Kit 1 promptini ishlating", "note": "Har intervyuni Geminiʼda matnga aylantiring, keyin Kit 1 promptini qoʻllang. Jadvaldagi har raqamni audio bilan tekshiring.", "files": [], "prompts": [{"id": "V3P1", "title": "Transkripsiya", "target": "Gemini", "text": "Ilova qilingan audio yozuvni oʻzbek tilida soʻzma-soʻz matnga aylantiring.\nSuhbatdoshlarni \"Soʻrovchi\" va \"[xodim ismi]\" deb ajrating.\nHar raqam, summa va vaqtni eshitilganidek soʻz bilan ham yozing, masalan: 300 000 (\"uch yuz ming\").\nTushunarsiz joyni [?] bilan belgilang, oʻzingizdan toʻldirmang."}, {"id": "V3P2", "title": "Kit 1 prompti: B shakli", "target": "Claude", "text": "Quyida [xodim ismi], [lavozimi] bilan intervyu matni va Kit 1 B shakli. Matndan B.1-B.9 boʻyicha vazifalar roʻyxatini tuzing.\nHar vazifada kamida shular boʻlsin: vazifa nomi; bir martasiga necha daqiqa; qanchalik tez-tez (kuniga, haftasiga, oyiga); haftasiga necha soat; B.9 belgisi (A agent, R robot, I inson, B birgalikda).\nRaqamni faqat matndan oling. Matnda aniq boʻlmasa, taxminingiz yoniga [?] qoʻying.\nOxirida haftalik soatlarni jamlang va tekshirilishi kerak boʻlgan raqamlarni alohida roʻyxat qiling. Jadvalni .md formatida bering.\n\nB shakli: [shakl matni]\nIntervyu: [intervyu matni]"}]}, {"title": "4. Xodim bilan tekshiring", "note": "Har B shaklini xodimning oʻziga koʻrsating. Daqiqa va chastotani u tuzatsin, [?] belgilari qolmasin. Haftalik soatlarni jamlang va har vazifaga B.9 belgisini qoʻying.", "files": []}, {"title": "5. .md fayl qilib saqlang", "note": "Har B shaklini alohida .md faylga saqlang, masalan kit1-dilnoza.md. Fayllarni ikkinchi darsga olib keling.", "files": []}, {"title": "6. Warp va Claude Codeʼni tekshiring", "note": "Noutbukingizda Warp va Claude Code ochilishini tekshiring. Ochilmasa, xatoning skrinshotini oling va Claudeʼdan soʻrang. Hal boʻlmasa, guruh chatiga yozing.", "files": []}]}};
const uz = s => String(s).replace(/ʻ/g, '‘').replace(/ʼ/g, '’');
const esc = s => uz(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const I = (id, w = 20) => `<svg width="${w}" height="${w}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
// "ASOSIY. intro 1) a 2) b Tayyor, agar: c"  ->  {tag, intro, steps[], ready}  (display only)
function parse(note) {
  let n = (note || '').trim(), tag = '', ready = '';
  const tm = n.match(/^([A-ZʻʼO' ]{3,20})\.\s+/); if (tm) { tag = tm[1]; n = n.slice(tm[0].length); }
  const ri = n.search(/\s*Tayyor, agar:\s*/); if (ri >= 0) { ready = n.slice(ri).replace(/^\s*Tayyor, agar:\s*/, ''); n = n.slice(0, ri); }
  const parts = n.split(/\s*(?=\b\d\)\s)/), intro = /^\d\)\s/.test(parts[0]) ? '' : parts.shift();
  const steps = parts.map(p => p.replace(/^\d\)\s*/, '').trim()).filter(Boolean);
  return {tag, intro: (intro || '').trim(), steps, ready: ready.trim()};
}
const AM = DATA.amaliyot, VZ = DATA.vazifa;
const num2 = n => String(n).padStart(2, '0');
const exs = AM.groups.map((g, i) => ({i, no: g.title.slice(0, 2), title: g.title.replace(/^\d+\s*/, ''), ...parse(g.note), prompts: g.prompts || []}));
const hws = VZ.groups.map((g, i) => ({i, no: num2(i + 1), title: g.title.replace(/^\d+\.\s*/, ''), note: g.note || '', prompts: g.prompts || []}));
const meta = e => [e.steps.length ? `${e.steps.length} qadam` : '', e.prompts.length ? `${e.prompts.length} prompt` : '', e.tag].filter(Boolean).join(' · ');
const hmeta = h => [h.prompts.length ? `${h.prompts.length} prompt` : 'amaliy ish'].join(' · ');
const intro = t => t.split(/\n\s*\n/).map(p => `<p class="lc-intro">${esc(p)}</p>`).join('');
const prompt = p => `<div class="lc-pr" data-open="0"><span class="pt">${esc(p.title)}</span><span class="pw">${esc(p.target || '')}</span><span class="cpb" aria-hidden="true">${I('copy')}</span><button class="tg" type="button">Matnni koʻrish</button><p class="tx">${esc(p.text)}</p></div>`.replace('Matnni koʻrish', uz('Matnni koʻrish'));
const stepsH = e => `${e.intro ? `<p class="lc-lead">${esc(e.intro)}</p>` : ''}${e.steps.length ? `<ol class="lc-steps">${e.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}${e.ready ? `<p class="lc-ready"><b>Tayyor, agar</b>${esc(e.ready)}</p>` : ''}${e.prompts.map(prompt).join('')}`;
const pc2 = p => `<button class="pc2" type="button"><span class="no">${esc(p.id)}</span><span><span class="t">${esc(p.title)}</span><span class="w">${esc(p.target || '')}</span></span><span class="cpb">${I('copy')}</span></button>`;
const pcs = ps => ps.length ? `<div class="pcs"><p class="pcs-h">Promptlar</p>${ps.map(pc2).join('')}</div>` : '';
const steps = e => `${e.intro ? `<p class="lead">${esc(e.intro)}</p>` : ''}${e.steps.length ? `<ol class="stp">${e.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}${e.ready ? `<p class="rdy"><b>Tayyor, agar</b>${esc(e.ready)}</p>` : ''}`;
const wIntro = t => `<div class="w-intro">${t.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
// W1: everything on one wide page: each exercise one row, steps left, prompts right
const W1_am = () => `${wIntro(AM.text)}${exs.map(e => `<section class="w-row"><div class="w-l"><span class="w-no">${e.no}</span><h3 class="w-tt">${esc(e.title)}</h3><span class="mtag">${esc(e.tag)}</span></div><div class="w-m">${steps(e)}</div><div class="w-r">${pcs(e.prompts) || '<p class="w-none">Bu mashqda prompt yoʻq</p>'}</div></section>`).join('')}`;
const W1_vz = () => `${wIntro(VZ.text)}${hws.map(h => `<section class="w-row"><div class="w-l"><span class="w-no">${h.no}</span><h3 class="w-tt">${esc(h.title)}</h3></div><div class="w-m"><p class="lead">${esc(h.note)}</p></div><div class="w-r">${pcs(h.prompts) || ''}</div></section>`).join('')}`;
// W2: number buttons, one exercise at a time, two columns
const pills = (on) => `<div class="d-pills">${exs.map((x, i) => `<button class="d-pill ${i === on ? 'on' : ''}" type="button">${x.no}<span class="pt">${esc(x.title)}</span></button>`).join('')}</div>`;
const W2_am = (k = 0) => { const e = exs[k], nx = exs[k + 1]; return `${wIntro(AM.text)}${pills(k)}<div class="w2"><div><span class="mtag">${e.no} · ${esc(e.tag)}</span><h3 class="w2-tt">${esc(e.title)}</h3>${steps(e)}</div><div>${pcs(e.prompts)}</div></div><div class="d-next">Keyingisi: ${nx.no} ${esc(nx.title)} →</div>`; };
// W3: side menu on the left, the chosen exercise on the right
const W3_am = (k = 0) => { const e = exs[k]; return `${wIntro(AM.text)}<div class="w3"><nav class="w3-nav">${exs.map((x, i) => `<a class="${i === k ? 'on' : ''}" href="#"><span class="no">${x.no}</span>${esc(x.title)}${i < k ? I('check', 14) : ''}</a>`).join('')}</nav><div class="w3-c"><span class="mtag">${e.no} · ${esc(e.tag)}</span><h3 class="w2-tt">${esc(e.title)}</h3>${steps(e)}${pcs(e.prompts)}<div class="d-next">Keyingisi: ${exs[k + 1].no} ${esc(exs[k + 1].title)} →</div></div></div>`; };
// Vazifa versions of W2 / W3 (the same homework W1 shows)
const vpills = on => `<div class="d-pills">${hws.map((x, i) => `<button class="d-pill ${i === on ? 'on' : ''}" type="button">${x.no}<span class="pt">${esc(x.title)}</span></button>`).join('')}</div>`;
const W2_vz = (k = 0) => { const h = hws[k], nx = hws[k + 1]; return `${wIntro(VZ.text)}${vpills(k)}<div class="w2"><div><span class="mtag">${h.no} / ${num2(hws.length)}</span><h3 class="w2-tt">${esc(h.title)}</h3><p class="lead">${esc(h.note)}</p></div><div>${pcs(h.prompts)}</div></div><div class="d-next">Keyingisi: ${nx.no} ${esc(nx.title)} →</div>`; };
const W3_vz = (k = 0) => { const h = hws[k], nx = hws[k + 1]; return `${wIntro(VZ.text)}<div class="w3"><nav class="w3-nav">${hws.map((x, i) => `<a class="${i === k ? 'on' : ''}" href="#"><span class="no">${x.no}</span>${esc(x.title)}</a>`).join('')}</nav><div class="w3-c"><span class="mtag">${h.no} / ${num2(hws.length)}</span><h3 class="w2-tt">${esc(h.title)}</h3><p class="lead">${esc(h.note)}</p>${pcs(h.prompts)}<div class="d-next">Keyingisi: ${nx.no} ${esc(nx.title)} →</div></div></div>`; };
const FOLDER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
const frame = (pane, tab) => `<div class="frame" data-h><div class="site">
  <header class="nav"><nav class="nav-links"><a class="home-btn" href="#">${I('home')}</a></nav><span class="wordmark">AI Praktikum 3.0</span><div class="nav-r"><a class="prep-btn" href="#"><span class="pb-ic">${FOLDER}</span><span class="pb-t">Birinchi darsgacha</span></a><button class="nav-name" type="button">Student</button><button class="menu-btn" type="button" aria-label="Menyu">${I('menu')}</button></div></header>
  <main><div class="w-top"><div class="dl-h w-dl"><a class="eyebrow" href="#">${I('back', 16)}Dastur</a><p class="dl-m">21-noyabr · 0/2 bajarildi</p></div>
    <h1 class="w-h1"><span class="w-n">01-dars</span> AI qanday ishlaydi</h1><div class="w-hr"><p class="lsub">${esc(DATA.subtitle)}</p><p class="lede">${esc(DATA.summary)}</p></div></div>
    <div class="w-wrap"><div class="gt gt-lilac g-lilac" style="--n:2;--i:${tab === 'am' ? 0 : 1}"><div class="gt-goo" aria-hidden="true"><span class="gt-ind"></span><span class="gt-pan"></span></div>
      <div class="gt-tabs" role="tablist"><button class="gt-tab" role="tab" type="button" aria-selected="${tab === 'am'}">Amaliyot</button><button class="gt-tab" role="tab" type="button" aria-selected="${tab === 'vz'}">Vazifa</button></div>
      <div class="gt-body"><div class="gt-pane" role="tabpanel"><div>${pane}</div><div class="gt-foot end"><button class="endb" type="button" aria-pressed="false">${tab === 'am' ? 'Amaliyot bajarildi' : 'Vazifa bajarildi'}</button></div></div></div></div></div></main></div></div>`;
const OPTS = [
  ['W1', 'Hammasi bir sahifada, uch ustun', 'Papka butun sahifa enida. Har mashq bitta qator: chapda raqam va nom, oʻrtada qadamlar, oʻngda promptlar. Hech narsa yashirilmaydi.', [['am', W1_am()], ['vz', W1_vz()]]],
  ['W2', 'Raqamli tugmalar, ikki ustun', 'Tepada mashq tugmalari (raqam va nom). Bitta mashq koʻrinadi: chapda qadamlar, oʻngda promptlar.', [['am', W2_am(0)], ['vz', W2_vz(0)]]],
  ['W3', 'Chap menyu', 'Chapda mashqlar roʻyxati, oʻngda tanlangan mashq. Hujjat saytlari kabi.', [['am', W3_am(0)], ['vz', W3_vz(0)]]],
];
document.getElementById('out').innerHTML = OPTS.map(([k, n, d, frames]) => `<section class="lc-opt" id="o${k}"><p class="lc-name">Variant ${k}: ${uz(n)}<small>${uz(d)}</small></p>${frames.map(([tab, pane]) => `<p class="lc-h">${k}-${tab === 'am' ? 'Amaliyot' : 'Vazifa'}</p>${frame(pane, tab)}`).join('')}</section>`).join('');
document.addEventListener('click', e => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });
// colour switcher: every lesson folder colour (01 lilac ... 06 cream)
const COLS = [['lilac', '01-dars'], ['grey', 'Kirish'], ['blue', '02-dars'], ['dark', '03-dars'], ['orange', '04-dars'], ['emerald', '05-dars'], ['cream', '06-dars']];
const bar = document.createElement('div'); bar.className = 'cbar';
bar.innerHTML = '<span>Rang:</span>' + COLS.map(([c, l], i) => `<button type="button" data-c="${c}" class="${i ? '' : 'on'}"><i class="sw sw-${c}"></i>${l}</button>`).join('');
document.body.prepend(bar);
bar.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  bar.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.gt').forEach(g => { g.className = g.className.replace(/\b(gt|g)-(lilac|grey|blue|dark|orange|emerald|cream)\b/g, (m, p) => `${p}-${b.dataset.c}`); }); });

</script></body></html>
