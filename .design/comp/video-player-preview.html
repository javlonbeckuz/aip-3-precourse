<!doctype html>
<html lang="uz-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Video pleer</title>
<link rel="stylesheet" href="../../public/aip/app.css">
<style>
body{margin:0;background:#000;color:#fff}
.pv-h{margin:0;padding:14px 16px;font:500 15px/1.4 var(--font-body);border-bottom:1px solid #3F3F3F;background:#0b0b0b}
.pv-h small{display:block;margin-top:2px;font:400 13px/1.4 var(--font-body);color:#A6A6A6}
.wrap{max-width:860px;margin:32px auto;padding:0 16px}
/* ---- the player (port of the pasted VideoPlayer): custom controls only, so the browser's own menu (with Download) never shows */
.vp{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/9;min-height:220px;border-radius:16px;background:#0a0a0a;color:#fff;font:450 14px/1.4 var(--font-body);outline:none;box-shadow:0 0 0 .5px rgb(255 255 255 / .09)}
.vp:focus-visible{box-shadow:0 0 0 2px #fff}
.vp[data-idle]{cursor:none}
.vp video{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;background:#000}
.vp-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to top,rgb(0 0 0 / .75),rgb(0 0 0 / .1) 45%,rgb(0 0 0 / .25))}
.vp-b{display:grid;place-items:center;flex:none;border-radius:8px;background:rgb(0 0 0 / .45);color:#fff;cursor:pointer;transition:background-color .15s ease,scale .15s ease}
.vp-b:hover{background:rgb(0 0 0 / .65)}.vp-b:active{scale:.96}
.vp-b:focus-visible{outline:2px solid #fff;outline-offset:4px}
.vp-top,.vp-mid,.vp-bot{transition:opacity .3s cubic-bezier(.23,1,.32,1),translate .3s cubic-bezier(.23,1,.32,1)}
.vp[data-idle] .vp-top,.vp[data-idle] .vp-mid,.vp[data-idle] .vp-bot{opacity:0;pointer-events:none}
.vp[data-idle] .vp-top{translate:0 -8px}.vp[data-idle] .vp-bot{translate:0 8px}
.vp-top{position:absolute;inset:16px 16px auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.vp-fs{width:36px;height:36px}
.vp-vol{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;background:rgb(0 0 0 / .45)}
.vp-mute{width:24px;height:24px;background:none}
.vp-mid{position:absolute;inset:45% 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;translate:0 -50%}
.vp-skip{width:44px;height:44px}
.vp-play{position:relative;width:60px;height:60px}
.vp-play .ring{position:absolute;inset:0;border:2px solid rgb(255 255 255 / .7);border-radius:8px;opacity:0;pointer-events:none}
.vp-play .ring.go{animation:vp-ring .5s ease-out}
@keyframes vp-ring{from{opacity:.8;scale:1}to{opacity:0;scale:1.7}}
.vp-ic{display:grid}.vp-ic>*{grid-area:1/1;transition:opacity .15s cubic-bezier(.23,1,.32,1),scale .15s cubic-bezier(.23,1,.32,1)}
.vp-ic .off{opacity:0;scale:.75}
.vp-flash{position:absolute;left:50%;top:-6px;translate:-50% 0;padding:4px 10px;border-radius:999px;background:rgb(0 0 0 / .55);font:500 13px/1 var(--font-body);font-variant-numeric:tabular-nums;opacity:0;pointer-events:none}
.vp-flash.go{animation:vp-flash .7s cubic-bezier(.23,1,.32,1)}
@keyframes vp-flash{0%{opacity:0;translate:-50% 8px}25%{opacity:1;translate:-50% -4px}100%{opacity:0;translate:-50% -20px}}
.vp-bot{position:absolute;inset:auto 16px 16px}
.vp-sub{margin:0 0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:500 14px/1.4 var(--font-body);color:rgb(255 255 255 / .8)}
.vp-t{margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:500 16px/1.3 var(--font-body)}
.vp-track{position:relative;margin-top:14px}
.vp-tip{position:absolute;bottom:14px;translate:-50% 0;padding:2px 6px;border-radius:6px;background:rgb(0 0 0 / .7);font:500 12px/1.4 var(--font-body);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.vp-times{display:flex;justify-content:space-between;margin-top:8px;font:500 13px/1.4 var(--font-body);font-variant-numeric:tabular-nums;color:rgb(255 255 255 / .75)}
.vp input[type=range]{display:block;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;outline:none;background:linear-gradient(to right,#fff var(--p,0%),rgb(255 255 255 / .25) var(--p,0%))}
.vp input[type=range]:focus-visible{box-shadow:0 0 0 2px rgb(0 0 0 / .4),0 0 0 4px #fff}
.vp input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.vp input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.vp .vp-prog{width:100%;transition:height .15s}.vp .vp-prog:hover{height:6px}
.vp .vp-vr{width:64px}
@media (max-width:599px){.vp-top{inset:10px 10px auto}.vp-bot{inset:auto 12px 10px}.vp-mid{gap:12px}.vp-play{width:52px;height:52px}.vp-sub{display:none}.vp-t{font-size:14px}.vp-track{margin-top:8px}.vp-times{margin-top:4px;font-size:12px}.vp .vp-vr{display:none}}
@media (prefers-reduced-motion:reduce){.vp *{transition:none!important;animation:none!important}}
</style></head><body>
<p class="pv-h">Video pleer: yangi koʻrinish (sinov)<small>Haqiqiy NotebookLM videosi. Pastda: portalga qoʻshilgandan keyin ham shu pleer boʻladi. Yuklab olish tugmasi yoʻq.</small></p>
<div class="wrap"><div class="vp-host" data-src="../../content/lessons/0/video/notebooklm.mp4" data-poster="../../content/lessons/0/video/notebooklm.jpg" data-title="NotebookLM: kompaniya bilim bazasi" data-sub="Video dars, 20 daqiqa"></div></div>
<script>
// vanilla port of the pasted React VideoPlayer: same controls, idle hide, seek flash, hover time, keyboard; Uzbek labels; no native controls (so no Download menu)
const VP_I = {
  play: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="600">10</text></svg>',
  fwd: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="600">10</text></svg>',
  full: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  vol: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  mute: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
};
const vpTime = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function vpMount(host){
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  host.innerHTML = `<section class="vp" tabindex="0" aria-label="Video pleer" aria-keyshortcuts="Space K J L ArrowLeft ArrowRight M F">
    <video preload="metadata" playsinline controlslist="nodownload noplaybackrate" disablepictureinpicture disableremoteplayback poster="${esc(host.dataset.poster)}" src="${esc(host.dataset.src)}"></video><div class="vp-shade"></div>
    <div class="vp-top"><button class="vp-b vp-fs" type="button" aria-label="Toʻliq ekran">${VP_I.full}</button>
      <div class="vp-vol"><input class="vp-vr" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Ovoz balandligi"><button class="vp-b vp-mute" type="button" aria-label="Ovozni oʻchirish"><span class="vp-ic"><span class="i-on">${VP_I.vol}</span><span class="i-off off">${VP_I.mute}</span></span></button></div></div>
    <div class="vp-mid"><button class="vp-b vp-skip" type="button" data-d="-10" aria-label="10 soniya orqaga">${VP_I.back}</button><span class="vp-flash" aria-hidden="true"></span>
      <button class="vp-b vp-play" type="button" aria-label="Ijro etish"><span class="vp-ic"><span class="i-p">${VP_I.play}</span><span class="i-z off">${VP_I.pause}</span></span><span class="ring"></span></button>
      <button class="vp-b vp-skip" type="button" data-d="10" aria-label="10 soniya oldinga">${VP_I.fwd}</button></div>
    <div class="vp-bot">${host.dataset.sub ? `<p class="vp-sub">${esc(host.dataset.sub)}</p>` : ''}<h3 class="vp-t">${esc(host.dataset.title)}</h3>
      <div class="vp-track"><span class="vp-tip" hidden></span><input class="vp-prog" type="range" min="0" max="0" step="0.1" value="0" aria-label="Video holati"></div>
      <div class="vp-times"><span class="vp-cur">0:00</span><span class="vp-dur">0:00</span></div></div></section>`;
  const $ = s => host.querySelector(s), box = $('.vp'), v = $('video'), prog = $('.vp-prog'), vr = $('.vp-vr'), tip = $('.vp-tip');
  let idleT = 0, vol = 0.7; v.volume = vol;
  box.addEventListener('contextmenu', e => e.preventDefault());   // no "Save video as..."
  const wake = () => { delete box.dataset.idle; clearTimeout(idleT); if (!v.paused) idleT = setTimeout(() => { box.dataset.idle = ''; }, 2200); };
  const paint = () => { const d = v.duration || 0, t = v.currentTime || 0; prog.max = d; prog.value = t; prog.style.setProperty('--p', (d ? t / d * 100 : 0) + '%'); prog.setAttribute('aria-valuetext', `${vpTime(t)} / ${vpTime(d)}`); $('.vp-cur').textContent = vpTime(t); $('.vp-dur').textContent = vpTime(d); };
  const playing = () => { const on = !v.paused; $('.i-p').classList.toggle('off', on); $('.i-z').classList.toggle('off', !on); $('.vp-play').setAttribute('aria-label', on ? 'Pauza' : 'Ijro etish'); const r = $('.ring'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); wake(); };
  const toggle = () => { v.paused ? v.play() : v.pause(); };
  const seekBy = s => { v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + s)); const f = $('.vp-flash'); f.textContent = s > 0 ? `+${s}s` : `${s}s`; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); wake(); };
  const setVol = x => { vol = x; v.volume = x; v.muted = x === 0; vr.value = x; vr.style.setProperty('--p', x * 100 + '%'); $('.i-on').classList.toggle('off', x === 0); $('.i-off').classList.toggle('off', x !== 0); $('.vp-mute').setAttribute('aria-label', x === 0 ? 'Ovozni yoqish' : 'Ovozni oʻchirish'); };
  let lastVol = 0.7;
  const fullscreen = async () => { try { document.fullscreenElement === box ? await document.exitFullscreen() : await box.requestFullscreen(); } catch {} };
  v.addEventListener('timeupdate', paint); v.addEventListener('loadedmetadata', paint); v.addEventListener('play', playing); v.addEventListener('pause', playing);
  v.addEventListener('click', toggle);
  $('.vp-play').addEventListener('click', toggle);
  host.querySelectorAll('.vp-skip').forEach(b => b.addEventListener('click', () => seekBy(+b.dataset.d)));
  $('.vp-fs').addEventListener('click', fullscreen);
  $('.vp-mute').addEventListener('click', () => { if (vol > 0) { lastVol = vol; setVol(0); } else setVol(lastVol || 0.7); });
  vr.addEventListener('input', () => setVol(+vr.value));
  prog.addEventListener('input', () => { v.currentTime = +prog.value; paint(); });
  prog.addEventListener('pointermove', e => { const r = prog.getBoundingClientRect(), k = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); tip.hidden = false; tip.style.left = k * r.width + 'px'; tip.textContent = vpTime(k * (v.duration || 0)); });
  prog.addEventListener('pointerleave', () => { tip.hidden = true; });
  box.addEventListener('pointermove', wake); box.addEventListener('focusin', wake);
  box.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target === vr) return;
    const k = e.key.toLowerCase(), act = {' ': toggle, k: toggle, arrowleft: () => seekBy(-10), j: () => seekBy(-10), arrowright: () => seekBy(10), l: () => seekBy(10), m: () => $('.vp-mute').click(), f: fullscreen}[k];
    if (!act || (e.target.tagName === 'BUTTON' && (k === ' ' || k === 'enter'))) return;
    e.preventDefault(); act(); wake();
  });
  setVol(vol); paint();
}
document.querySelectorAll('.vp-host').forEach(vpMount);
</script></body></html>
