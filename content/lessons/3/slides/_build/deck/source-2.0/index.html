let currentSlideIdx = 0;
const totalSlides = slidesData.length;

// DOM Elements
const currSlideEl = document.getElementById('curr-slide');
const totalSlidesEl = document.getElementById('total-slides');
const chapterTitleEl = document.getElementById('chapter-title');
const slideNumTagEl = document.getElementById('slide-num-tag');
const slideTitleEl = document.getElementById('slide-title');
const bodyLeftEl = document.getElementById('body-left');
const visualTagEl = document.getElementById('visual-tag');
const visualContentEl = document.getElementById('visual-content');
const drawerBodyEl = document.getElementById('drawer-body');
const speakerDrawerEl = document.getElementById('speaker-drawer');
const notesBtn = document.getElementById('notes-btn');
const closeDrawerBtn = document.getElementById('close-drawer-btn');
const progressFillEl = document.getElementById('progress-fill');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

totalSlidesEl.textContent = totalSlides;

function renderSlide(idx) {
  const s = slidesData[idx];
  currSlideEl.textContent = s.num;
  chapterTitleEl.textContent = s.chapter;
  slideNumTagEl.textContent = `SLAYD ${String(s.num).padStart(2, '0')} // ${totalSlides}`;
  slideTitleEl.textContent = s.title;

  // Bullets
  bodyLeftEl.innerHTML = '';
  s.bullets.forEach((b, i) => {
    const card = document.createElement('div');
    card.className = 'card-bullet';
    card.innerHTML = `
      <h4><span style="color:var(--accent-blue); font-family:var(--font-mono); font-size:14px;">[0${i+1}]</span> ${b.h}</h4>
      <p>${b.p}</p>
    `;
    bodyLeftEl.appendChild(card);
  });

  // Visual
  visualTagEl.textContent = s.visualTag || "Sxema & Arxitektura";
  visualContentEl.textContent = s.visual;

  // Speaker notes
  drawerBodyEl.textContent = s.talkTrack;

  // Progress
  const progressPct = ((idx + 1) / totalSlides) * 100;
  progressFillEl.style.width = `${progressPct}%`;
}

function nextSlide() {
  if (currentSlideIdx < totalSlides - 1) {
    currentSlideIdx++;
    renderSlide(currentSlideIdx);
  }
}

function prevSlide() {
  if (currentSlideIdx > 0) {
    currentSlideIdx--;
    renderSlide(currentSlideIdx);
  }
}

function toggleNotes() {
  speakerDrawerEl.classList.toggle('open');
  notesBtn.classList.toggle('active');
}

// Event Listeners
nextBtn.addEventListener('click', nextSlide);
prevBtn.addEventListener('click', prevSlide);
notesBtn.addEventListener('click', toggleNotes);
closeDrawerBtn.addEventListener('click', () => {
  speakerDrawerEl.classList.remove('open');
  notesBtn.classList.remove('active');
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    nextSlide();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    prevSlide();
  } else if (e.key.toLowerCase() === 'p') {
    e.preventDefault();
    toggleNotes();
  }
});

// Initial Render
renderSlide(0);
</script>
</body>
</html>
